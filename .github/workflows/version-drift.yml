name: Version drift

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert referenced version matches latest stable on nuget.org
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $indexUrl = 'https://api.nuget.org/v3-flatcontainer/observables.events.r3/index.json'

          $source = Get-Content -Raw '.vitepress/observables-version.ts'
          $referenced = [regex]::Match($source, "observablesVersion\s*=\s*'([^']+)'").Groups[1].Value
          if (-not $referenced) { throw 'Could not read observablesVersion from .vitepress/observables-version.ts.' }

          # Poll until the referenced version is indexed: a sync PR opened
          # right after a release can land before nuget.org catches up.
          $versions = @()
          for ($attempt = 1; $attempt -le 20; $attempt++) {
              $versions = @((Invoke-RestMethod $indexUrl).versions)
              if ($versions -contains $referenced) { break }
              if ($attempt -eq 20) {
                  throw "Referenced version $referenced is not listed on nuget.org after polling."
              }
              Write-Host "Waiting for $referenced to appear on nuget.org (attempt $attempt/20)..."
              Start-Sleep -Seconds 30
          }

          $latestStable = @($versions | Where-Object { $_ -notmatch '-' })[-1]
          if ($referenced -ne $latestStable) {
              throw "Referenced version $referenced does not match latest stable $latestStable on nuget.org. Run: pwsh scripts/sync-observables-version.ps1 -Version $latestStable"
          }
          Write-Host "Referenced version $referenced == latest stable on nuget.org."

      - name: Assert markdown uses the %%OBS_VERSION%% token
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The current Observables version may only appear as the
          # %%OBS_VERSION%% token; literals live solely in
          # .vitepress/observables-version.ts. Third-party package versions
          # and historical "ships from X.Y.Z" prose are intentional.
          $bad = @()
          $bad += git grep -nE 'Observables\.[A-Za-z.]+" Version="[0-9]' -- docs/
          $bad += git grep -nE 'nuget\.org/packages/Observables\.[A-Za-z.]+/[0-9]' -- docs/
          if ($bad.Count -gt 0) {
              $bad | ForEach-Object { Write-Host "::error::$_" }
              throw 'Hardcoded version literal(s) found; use the %%OBS_VERSION%% token instead.'
          }
          Write-Host 'All version references use the %%OBS_VERSION%% token.'
          exit 0
